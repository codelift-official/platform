name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔨 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install dependencies
        run: npm ci --include=dev

      - name: 🔨 Run CodeLift Vite Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ADMIN_WHATSAPP: ${{ secrets.VITE_ADMIN_WHATSAPP }}
          VITE_BASE_PATH: ${{ secrets.VITE_BASE_PATH || '/platform/' }}
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
        run: |
          if [ -n "$VITE_SUPABASE_URL" ] && [ -n "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "✅ Supabase build variables detected in CI environment"
          else
            echo "ℹ️ Supabase secrets not detected in CI environment. Building with resilient offline seed fallback."
          fi
          if [ -n "$VITE_EMAILJS_SERVICE_ID" ] && [ -n "$VITE_EMAILJS_PUBLIC_KEY" ]; then
            echo "✅ EmailJS credentials detected — email notifications will be active"
          else
            echo "ℹ️ EmailJS secrets not set — emails disabled until configured in Admin Settings"
          fi
          set +e
          output=$(npm run build 2>&1)
          status=$?
          echo "$output"
          if [ $status -ne 0 ]; then
            clean_err=$(echo "$output" | tail -n 25 | tr '\r\n' '  ')
            echo "::error title=Build Failure::$clean_err"
            exit $status
          fi

      - name: 📦 Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
