<!doctype html>
<html lang="en" data-theme="dark-nebula" data-bs-theme="dark" data-theme-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CodeLift platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function () {
        try {
          var themes = [
            'forest-green', 'emerald', 'dark-green', 'navy-blue',
            'indigo', 'teal', 'amber', 'rose', 'purple', 'neutral',
            'dark-emerald', 'dark-nebula', 'dark-carbon',
            'ocean-blue', 'royal-indigo', 'sunset-orange', 'rose-pink',
            'amethyst-purple', 'teal-wave', 'crimson-red', 'graphite-grey',
            'midnight-emerald', 'nebula', 'nebula-night', 'carbon-black'
          ];
          var aliases = {
            'ocean-blue': 'navy-blue',
            'royal-indigo': 'indigo',
            'sunset-orange': 'amber',
            'rose-pink': 'rose',
            'amethyst-purple': 'purple',
            'teal-wave': 'teal',
            'crimson-red': 'dark-green',
            'graphite-grey': 'neutral',
            'midnight-emerald': 'dark-emerald',
            'nebula': 'dark-nebula',
            'nebula-night': 'dark-nebula',
            'carbon-black': 'dark-carbon'
          };
          var m = document.cookie.match(/(?:^|; )codelift_theme=([^;]*)/);
          var theme = m ? decodeURIComponent(m[1]) : null;
          if (!theme) theme = localStorage.getItem('codelift_theme');
          if (theme && aliases[theme]) theme = aliases[theme];
          var darkThemeList = ['dark-green', 'dark-emerald', 'dark-nebula', 'dark-carbon', 'midnight-emerald', 'nebula-night', 'carbon-black', 'nebula'];
          var isDark = darkThemeList.indexOf(theme) !== -1;
          var mode = isDark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.setAttribute('data-bs-theme', mode);
          document.documentElement.setAttribute('data-theme-mode', mode);
          if (document.body) {
            document.body.setAttribute('data-theme', theme);
            document.body.setAttribute('data-bs-theme', mode);
            document.body.setAttribute('data-theme-mode', mode);
          }

          // Cache-bust favicon links so updated logos refresh immediately
          var cacheBust = '?v=' + Date.now();
          var fi = document.querySelector('link[rel="icon"]');
          if (fi) fi.href = '/favicon.png' + cacheBust;
          var si = document.querySelector('link[rel="shortcut icon"]');
          if (si) si.href = '/favicon.ico' + cacheBust;
          var ai = document.querySelector('link[rel="apple-touch-icon"]');
          if (ai) ai.href = '/favicon.png' + cacheBust;
        } catch (e) {}
      })();
    </script>
  </head>
  <body data-theme="dark-nebula" data-bs-theme="dark" data-theme-mode="dark">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
